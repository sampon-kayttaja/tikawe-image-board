{% extends "layout.html" %}

{% block title %}Create account{% endblock %}
{% block content %}
  <section>
    <h1>Create an account</h1>
    <form action="/send_user" method="post">
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
      <div>
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" minlength="4" required>
      </div>
      <div>
        <label for="password1">Password</label>
        <input type="password" id="password1" name="password1" autocomplete="new-password" minlength="8" required>
      </div>
      <div>
        <label for="password2">Confirm password</label>
        <input type="password" id="password2" name="password2" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="/login">Log in</a>.</p>
  </section>
{% endblock %}
