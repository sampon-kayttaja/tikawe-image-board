{% extends "layout.html" %}

{% block title %}New post{% endblock %}
{% block page_class %}page-narrow{% endblock %}

{% block content %}
  <section class="panel form-panel">
    <h1>Create a post</h1>
    <p class="subtitle">Share an idea, a moment, or something you found interesting.</p>
    <form action="/send" method="post" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
      <div class="field">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required>
      </div>
      <div class="field">
        <label for="content">Your post</label>
        <textarea id="content" name="content" required></textarea>
      </div>
      <div>
        <label for="topic">Topic</label>
        <select id="topic" name="topic" required>
          <option value="">Select a topic</option>
          <option value="Nature">Nature</option>
          <option value="Art">Art</option>
          <option value="Travel">Travel</option>
          <option value="Food">Food</option>
          <option value="Sports">Sports</option>
          <option value="Music">Music</option>
          <option value="Fashion">Fashion</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div class="field">
        <label for="picture">Picture</label>
        <input type="file" id="picture" name="picture" accept="image/jpeg,.jpg" required>
      </div>
      <div class="form-actions">
        <button type="submit">Create post</button>
        <a class="button button-secondary" href="/">Cancel</a>
      </div>
    </form>
  </section>
{% endblock %}
